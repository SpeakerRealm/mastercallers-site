<section class="hero">
  <h1>Contact</h1>
  <p>Qualified brief or consultation request.</p>
  <div class="accent-bar"></div>
</section>

<section class="section">
  <form action="mailto:support@mastercallers.ai" method="post" enctype="text/plain">
    <input type="text" name="organization" placeholder="Organization">
    <input type="text" name="name" placeholder="Name">
    <input type="email" name="email" placeholder="Email" required>
    <select name="interest">
      <option value="">Interest</option>
      <option>Development</option>
      <option>Training</option>
      <option>Teams</option>
      <option>Curriculum</option>
    </select>
    <textarea name="brief" placeholder="What are you trying to build or enable?"></textarea>
    <button type="submit">Send brief</button>
  </form>
  <p style="margin-top:24px; color: var(--text-muted); font-size:14px;">
    Or book a consultation: <a href="https://calendly.com/mastercallers--speakerrealm/consultation" style="color: var(--accent);">calendly.com/mastercallers--speakerrealm/consultation</a>
  </p>
</section>

  <div>MasterCallers</div>
